{{- $n := int (.Get "n" | default 6) -}}
{{- $posts := where site.RegularPages "Section" "posts" -}}
<div class="recent-posts">
  <ul class="rp-list">
  {{- range first $n $posts.ByDate.Reverse }}
    <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{- end }}
  </ul>
  <p><a href="{{ (site.GetPage "/posts").RelPermalink }}">All posts →</a></p>
</div>
