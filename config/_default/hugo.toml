# hugo server --minify --themesDir ../.. --baseURL=http://0.0.0.0:1313/theme/hugo-book/

baseURL = 'https://anvaratayev.com/'
languageCode = 'en-gb'
title = 'Anvar A.'

# Core Hugo settings (must precede any [table] header, otherwise TOML scopes them to that table)
disablePathToLower = true # book configuration
enableGitInfo = true
enableEmoji = true  # enable emojis
publishDir = "public" # make compatible with github pages

# Theme settings
[module]
    [[module.imports]]
        path = 'github.com/alex-shpak/hugo-book'
        # Remount theme packages without theme static (mermaid, katex, asciinema,
        # fuse are unused; search is off and math uses MathJax).
        [[module.imports.mounts]]
            source = 'layouts'
            target = 'layouts'
        [[module.imports.mounts]]
            source = 'assets'
            target = 'assets'
        [[module.imports.mounts]]
            source = 'i18n'
            target = 'i18n'
        [[module.imports.mounts]]
            source = 'archetypes'
            target = 'archetypes'
        [[module.imports.mounts]]
            source = 'data'
            target = 'data'

[outputs]
  home    = ["HTML"]
  section = ["HTML"]

# Goldmark passthrough keeps $$ / \( \) for MathJax
# visit https://gohugo.io/getting-started/configuration-markup/#goldmark for more information
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      footnote = true
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$'], ['\\begin{', '\\end{']]
          inline = [['\\(', '\\)'], ['$', '$']]

    [markup.tableOfContents]
        startLevel = 1

  [markup.highlight]
    style = "gruvbox"