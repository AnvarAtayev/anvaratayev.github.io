name: Build site
description: >-
  Install the Hugo release pinned in .github/hugo-version, the Dart Sass
  release pinned in .github/dart-sass-version, Pandoc, and npm dependencies,
  then run ./bin/build with the GitHub Pages base URL. Does not deploy.

runs:
  using: composite
  steps:
    - name: Install Hugo CLI
      shell: bash
      run: |
        HUGO_VERSION="$(tr -d '[:space:]' < .github/hugo-version)"
        test -n "$HUGO_VERSION"
        # 0.170.0 retired the extended edition. The standard package includes
        # the former extended features except embedded LibSass.
        wget -O ${{ runner.temp }}/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
        hugo version

    - name: Install Dart Sass
      shell: bash
      run: |
        SASS_VERSION="$(tr -d '[:space:]' < .github/dart-sass-version)"
        test -n "$SASS_VERSION"
        wget -O ${{ runner.temp }}/dart-sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz"
        rm -rf ${{ runner.temp }}/dart-sass
        tar -C ${{ runner.temp }} -xzf ${{ runner.temp }}/dart-sass.tar.gz
        sudo rm -rf /usr/local/dart-sass
        sudo mv ${{ runner.temp }}/dart-sass /usr/local/dart-sass
        sudo ln -sfn /usr/local/dart-sass/sass /usr/local/bin/sass
        sass --version

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    - name: Install Node.js dependencies
      shell: bash
      run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

    - name: Install Pandoc
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y pandoc

    - name: Build (bibliography → Hugo → KaTeX)
      shell: bash
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: ./bin/build --baseURL "${{ steps.pages.outputs.base_url }}/"
