{{ $config := site.Params.giscus }}
<section class="post-discussion" id="discussion" aria-label="Comments">
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
          data-repo="{{ $config.repo }}"
          data-repo-id="{{ $config.repoId }}"
          data-category="{{ $config.category }}"
          data-category-id="{{ $config.categoryId }}"
          data-mapping="specific"
          data-term="{{ default .RelPermalink .Params.commentsId }}"
          data-strict="1"
          data-reactions-enabled="0"
          data-input-position="top"
          data-theme="preferred_color_scheme"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async></script>
  <noscript><p>Enable JavaScript to view discussions or visit <a href="https://github.com/{{ $config.repo }}/discussions">GitHub Discussions</a>.</p></noscript>
</section>
{{ $script := resources.Get "giscus-theme.js" | resources.Fingerprint }}
<script src="{{ $script.RelPermalink }}" defer></script>
